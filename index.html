<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penghitung Jari AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9f0ec; --ink:#10302b; --paper:#f8fbf9; --accent:#f0b429;
    --line:#b9ccc4; --muted:#4f6b64; --warn:#a63d2b; --track:#25473f;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
       background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5}
  .wrap{max-width:1080px;margin:0 auto;padding:clamp(1rem,4vw,2.5rem)}
  h1{font-size:clamp(1.9rem,5vw,3.2rem);line-height:1.05;margin:0 0 .6rem;font-weight:800;letter-spacing:-.02em}
  .sub{margin:0 0 2rem;color:var(--muted);max-width:52ch}

  .stage{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1rem,3vw,2rem);align-items:stretch}
  @media (max-width:760px){.stage{grid-template-columns:1fr}}

  .cam{display:flex;flex-direction:column;gap:1rem}
  .frame{position:relative;aspect-ratio:1/1;background:var(--paper);border:2px solid var(--line);
         border-radius:28px;overflow:hidden;display:grid;place-items:center}
  .frame canvas{width:100%;height:100%;display:block}
  .idle{position:absolute;inset:0;display:grid;place-items:center;padding:2rem;text-align:center;color:var(--muted)}
  .frame.live .idle{display:none}

  .btn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:.85rem 1.7rem;
       background:var(--ink);color:var(--paper);cursor:pointer;align-self:flex-start}
  .btn:hover{background:#1b4a42}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .btn:disabled{opacity:.6;cursor:wait}
  .btn.stop{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
  .status{margin:0;min-height:1.5em;color:var(--muted)}
  .status.err{color:var(--warn);font-weight:600}

  .result{background:var(--ink);color:var(--bg);border-radius:28px;
          padding:clamp(1.25rem,3vw,2rem);display:flex;flex-direction:column}
  .num{font-size:clamp(8rem,24vw,15rem);font-weight:800;line-height:.9;letter-spacing:-.04em;
       color:var(--accent);margin:0;font-variant-numeric:tabular-nums}
  .num.dim{color:#7d958d}
  .label{font-size:1.25rem;font-weight:600;margin:.4rem 0 1.5rem;min-height:1.6em}
  .bars{margin:auto 0 0;padding:0;list-style:none;display:grid;gap:.9rem}
  .bar-top{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:.3rem}
  .track{height:10px;background:var(--track);border-radius:4px;overflow:hidden}
  .fill{height:100%;width:0;background:var(--accent);transition:width .12s linear}
  @media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Penghitung jari</h1>
  <p class="sub">Tunjukkan tangan ke kamera. AI akan mengenali apakah kamu mengangkat 3 atau 5 jari.</p>

  <div class="stage">
    <section class="cam" aria-label="Kamera">
      <div class="frame" id="frame">
        <div class="idle">Tekan “Nyalakan kamera” untuk mulai.</div>
      </div>
      <button class="btn" id="btn" type="button">Nyalakan kamera</button>
      <p class="status" id="status" role="status"></p>
    </section>

    <section class="result" aria-label="Hasil deteksi">
      <p class="num dim" id="num">–</p>
      <p class="label" id="label" aria-live="polite">Kamera belum menyala</p>
      <ul class="bars" id="bars"></ul>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script>
    // Model disimpan di folder "model" di samping index.html
  const MODEL_URL = "model/model.json";
  const META_URL  = "model/metadata.json";
  // Di bawah nilai ini, hasil dianggap belum yakin (0.75 = 75%)
  const THRESHOLD = 0.75;

  const $ = id => document.getElementById(id);
  const btn = $("btn"), statusEl = $("status"), frame = $("frame"),
        numEl = $("num"), labelEl = $("label"), barsEl = $("bars");

  let model, webcam, running = false, fills = [], pcts = [];

  function setStatus(msg, isErr = false) {
    statusEl.textContent = msg;
    statusEl.className = "status" + (isErr ? " err" : "");
  }
  function setLabel(t) { if (labelEl.textContent !== t) labelEl.textContent = t; }

  function buildBars(labels) {
    barsEl.innerHTML = "";
    fills = []; pcts = [];
    labels.forEach(name => {
      const li = document.createElement("li");
      li.innerHTML = '<div class="bar-top"><span></span><span>0%</span></div>' +
                     '<div class="track"><div class="fill"></div></div>';
      const spans = li.querySelectorAll("span");
      spans[0].textContent = name;
      pcts.push(spans[1]);
      fills.push(li.querySelector(".fill"));
      barsEl.appendChild(li);
    });
  }

  async function loadModel() {
    if (model) return;
    setStatus("Memuat model…");
    try {
      model = await tmImage.load(MODEL_URL, META_URL);
    } catch (e) {
      throw Object.assign(new Error("MODEL"), { cause: e });
    }
    buildBars(model.getClassLabels());
  }

  async function start() {
    btn.disabled = true;
    try {
      await loadModel();
      setStatus("Menyalakan kamera…");
      webcam = new tmImage.Webcam(400, 400, true); // true = cermin
      await webcam.setup();
      await webcam.play();
      frame.appendChild(webcam.canvas);
      frame.classList.add("live");
      running = true;
      btn.textContent = "Matikan kamera";
      btn.classList.add("stop");
      setStatus("Kamera menyala.");
      requestAnimationFrame(loop);
    } catch (e) {
      showError(e);
    } finally {
      btn.disabled = false;
    }
  }

  function stop() {
    running = false;
    if (webcam) { webcam.stop(); webcam.canvas.remove(); webcam = null; }
    frame.classList.remove("live");
    btn.textContent = "Nyalakan kamera";
    btn.classList.remove("stop");
    render(null);
    setStatus("Kamera mati.");
  }

  async function loop() {
    if (!running) return;
    webcam.update();
    const preds = await model.predict(webcam.canvas);
    if (running) render(preds);
    requestAnimationFrame(loop);
  }

  function render(preds) {
    if (!preds) {
      numEl.textContent = "–";
      numEl.classList.add("dim");
      setLabel("Kamera belum menyala");
      fills.forEach((f, i) => { f.style.width = "0%"; pcts[i].textContent = "0%"; });
      return;
    }
    preds.forEach((p, i) => {
      const v = Math.round(p.probability * 100);
      fills[i].style.width = v + "%";
      pcts[i].textContent = v + "%";
    });
    const top = preds.reduce((a, b) => (b.probability > a.probability ? b : a));
    if (top.probability >= THRESHOLD) {
      const digit = top.className.match(/\d+/);
      numEl.textContent = digit ? digit[0] : "–";
      numEl.classList.toggle("dim", !digit);
      setLabel(top.className);
    } else {
      numEl.textContent = "?";
      numEl.classList.add("dim");
      setLabel("Belum yakin. Dekatkan tangan ke kamera.");
    }
  }

  function showError(e) {
    let msg;
    if (e.message === "MODEL")
      msg = "Model gagal dimuat. Pastikan folder model berisi model.json, metadata.json, dan weights.bin yang tidak kosong.";
    else if (e.name === "NotAllowedError")
      msg = "Izin kamera ditolak. Izinkan akses kamera di pengaturan browser, lalu coba lagi.";
    else if (e.name === "NotFoundError")
      msg = "Kamera tidak ditemukan di perangkat ini.";
    else
      msg = "Terjadi kesalahan: " + (e.message || e);
    setStatus(msg, true);
    console.error(e);
  }

  btn.addEventListener("click", () => (running ? stop() : start()));
</script>
</body>
</html>
